<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img">
<title>Survival steps by evasion arm</title><desc>24 perimeter openings. Blind is bimodal — 11 total escapes and the rest caught early — while belief is consistent but escapes outright only 23 times.</desc>
