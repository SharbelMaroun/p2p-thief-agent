name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Thief quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history. `scan_git_history.py` reads every blob reachable from any ref, and
          # the default `fetch-depth: 1` leaves it one commit to read — it would print
          # "0 findings" having looked at the tip alone, which is indistinguishable from a
          # clean repository. The scanner now refuses a shallow clone rather than passing
          # quietly, so this is required for the gate to run at all.
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install frozen environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test with branch coverage
        run: uv run pytest --cov --cov-branch --cov-fail-under=85

      - name: Enforce file-length policy
        run: uv run python scripts/check_file_lengths.py

      - name: Scan for secrets
        run: uv run python scripts/check_secrets.py

      - name: Scan Git history for secrets
        run: uv run python scripts/scan_git_history.py

      # G-010..G-014. These invariants span five documents, so no single file review
      # can see a violation -- each file stays internally coherent while contradicting
      # the others. That is how DOCS_COMPLETENESS.md sat 29 rows behind.
      - name: Check ledger consistency
        run: uv run python scripts/check_ledger_consistency.py

      - name: Smoke-test CLI
        run: |
          uv run p2p-thief --help
          uv run p2p-thief --version

      - name: Verify contract remains pending
        shell: bash
        run: |
          set +e
          output="$(uv run python scripts/check_shared_contracts.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq "PENDING:" <<<"$output"

      - name: Check generated diff
        run: git diff --check
