[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "p2p-thief-agent"
dynamic = ["version"]
description = "Thief peer package for a distributed Cops-and-Robbers project"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sharbel Maroun and Amr safadi" }]
dependencies = [
    "fastmcp>=3.4.5,<4",
]

[project.scripts]
p2p-thief = "p2p_thief_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.hatch.version]
path = "src/p2p_thief_agent/shared/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_thief_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=p2p_thief_agent",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
