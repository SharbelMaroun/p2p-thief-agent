[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "p2p-thief-agent"
dynamic = ["version"]
description = "Thief peer package for a distributed Cops-and-Robbers project"
readme = "README.md"
# 3.11 is the floor because the private per-peer config is TOML (book p. 131) and
# `tomllib` entered the standard library in 3.11. CI runs 3.12 and the course
# reference runs 3.13, so 3.10 was a support claim nothing ever exercised.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sharbel Maroun and Amr safadi" }]
dependencies = [
    "fastmcp>=3.4.5,<4",
]

[project.scripts]
p2p-thief = "p2p_thief_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.hatch.version]
path = "src/p2p_thief_agent/shared/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_thief_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"  # matches requires-python; py310 was a claim nothing exercised

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=p2p_thief_agent",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]
# `M8-006c`: the widget layer is excluded, per the submission guidelines' coverage config.
# A Tk window cannot be asserted about in CI, and a test that merely constructs one proves
# only that Tk imports. What the screen *claims* lives in `replay/view_model.py`, which is
# covered -- see `tests/unit/test_replay_view_model.py`.
omit = ["src/*/ui/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
